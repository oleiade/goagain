name: Check Upstream Data

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force update even if no changes detected"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch all upstream branches
        run: |
          git -C data/upstream fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Update submodule (develop base pin)
        run: |
          git submodule update --remote data/upstream

      - name: Sync and merge data files
        run: |
          ./scripts/sync-data.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update card data from upstream"
          title: "chore: Update card data from upstream"
          body: |
            This PR updates the card data from the upstream repository.

            **Changes:**
            - Data merged from `develop` (base) plus every set branch
              (any branch other than `main`/`develop`), unioned by `unique_id`
              with set-branch-wins precedence.
            - Submodule pin advanced to the latest `develop` tip.
            - Merged files written to `internal/data/english/`.

            This PR opens only when the merged data actually changed.

            Please review the changes and merge if everything looks correct.

            ---
            *This PR was automatically created by the check-upstream workflow.*
          branch: chore/update-upstream-data
          delete-branch: true
          labels: |
            automated
            data-update
